<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大乐透AI预测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }
        
        .button:hover {
            background: #5568d3;
        }
        
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .prediction-result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .numbers {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .number {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
        }
        
        .front-number {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .back-number {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .stat-item h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1em;
        }
        
        .stat-numbers {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .stat-numbers span {
            background: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .success {
            background: #efe;
            color: #060;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }
        
        .success.show {
            display: block;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background: #667eea;
            color: white;
        }
        
        .disclaimer {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎰 大乐透AI预测系统</h1>
            <p>基于机器学习的号码分析与预测</p>
        </div>
        
        <div class="card">
            <h2>数据采集</h2>
            <button class="button" onclick="scrapeData()">采集历史开奖数据</button>
            <div id="scrapeLoading" class="loading">正在采集数据，请稍候...</div>
            <div id="scrapeError" class="error"></div>
            <div id="scrapeSuccess" class="success"></div>
        </div>
        
        <div class="card">
            <h2>AI号码预测</h2>
            <button class="button" onclick="predictNumbers()">生成预测号码</button>
            <div id="predictLoading" class="loading">AI正在分析中...</div>
            <div id="predictError" class="error"></div>
            <div id="predictionResult" class="prediction-result" style="display: none;">
                <h3>预测结果：</h3>
                <div>
                    <p><strong>前区号码：</strong></p>
                    <div id="frontNumbers" class="numbers"></div>
                </div>
                <div style="margin-top: 15px;">
                    <p><strong>后区号码：</strong></p>
                    <div id="backNumbers" class="numbers"></div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>统计分析</h2>
            <button class="button" onclick="loadStatistics()">查看统计数据</button>
            <div id="statsLoading" class="loading">加载中...</div>
            <div id="statsError" class="error"></div>
            <div id="statistics" class="stats-grid" style="display: none;"></div>
        </div>
        
        <div class="card">
            <h2>历史开奖记录</h2>
            <button class="button" onclick="loadHistory()">加载历史数据</button>
            <div id="historyLoading" class="loading">加载中...</div>
            <div id="historyError" class="error"></div>
            <div id="historyTable" style="overflow-x: auto;"></div>
        </div>
        
        <div class="disclaimer">
            ⚠️ 重要提示：本系统仅用于数据分析和学习研究，预测号码仅供参考。彩票开奖具有随机性，本系统不能保证中奖。请理性购彩，量力而行。
        </div>
    </div>
    
    <script>
        async function scrapeData() {
            const loading = document.getElementById('scrapeLoading');
            const error = document.getElementById('scrapeError');
            const success = document.getElementById('scrapeSuccess');
            
            loading.classList.add('show');
            error.classList.remove('show');
            success.classList.remove('show');
            
            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ limit: 5000 })
                });
                const data = await response.json();
                
                if (response.ok) {
                    let message = data.message;
                    if (data.sources) {
                        message += `\n数据来源：${data.sources.join(', ')}`;
                    }
                    success.textContent = message;
                    success.classList.add('show');
                } else {
                    error.textContent = '错误：' + (data.error || '数据采集失败');
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = '网络错误：' + err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
            }
        }
        
        async function predictNumbers() {
            const loading = document.getElementById('predictLoading');
            const error = document.getElementById('predictError');
            const result = document.getElementById('predictionResult');
            
            loading.classList.add('show');
            error.classList.remove('show');
            result.style.display = 'none';
            
            try {
                const response = await fetch('/api/predict', {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (response.ok) {
                    const frontDiv = document.getElementById('frontNumbers');
                    const backDiv = document.getElementById('backNumbers');
                    
                    frontDiv.innerHTML = '';
                    backDiv.innerHTML = '';
                    
                    data.prediction.front.forEach(num => {
                        const div = document.createElement('div');
                        div.className = 'number front-number';
                        div.textContent = String(num).padStart(2, '0');
                        frontDiv.appendChild(div);
                    });
                    
                    data.prediction.back.forEach(num => {
                        const div = document.createElement('div');
                        div.className = 'number back-number';
                        div.textContent = String(num).padStart(2, '0');
                        backDiv.appendChild(div);
                    });
                    
                    result.style.display = 'block';
                } else {
                    error.textContent = '错误：' + (data.error || '预测失败');
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = '网络错误：' + err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
            }
        }
        
        async function loadStatistics() {
            const loading = document.getElementById('statsLoading');
            const error = document.getElementById('statsError');
            const stats = document.getElementById('statistics');
            
            loading.classList.add('show');
            error.classList.remove('show');
            stats.style.display = 'none';
            
            try {
                const response = await fetch('/api/statistics');
                const data = await response.json();
                
                if (response.ok) {
                    stats.innerHTML = `
                        <div class="stat-item">
                            <h3>热门前区号码</h3>
                            <div class="stat-numbers">
                                ${data.hot_front.map(([num, count]) => 
                                    `<span>${num} (${count}次)</span>`
                                ).join('')}
                            </div>
                        </div>
                        <div class="stat-item">
                            <h3>冷门前区号码</h3>
                            <div class="stat-numbers">
                                ${data.cold_front.map(([num, count]) => 
                                    `<span>${num} (${count}次)</span>`
                                ).join('')}
                            </div>
                        </div>
                        <div class="stat-item">
                            <h3>热门后区号码</h3>
                            <div class="stat-numbers">
                                ${data.hot_back.map(([num, count]) => 
                                    `<span>${num} (${count}次)</span>`
                                ).join('')}
                            </div>
                        </div>
                        <div class="stat-item">
                            <h3>冷门后区号码</h3>
                            <div class="stat-numbers">
                                ${data.cold_back.map(([num, count]) => 
                                    `<span>${num} (${count}次)</span>`
                                ).join('')}
                            </div>
                        </div>
                    `;
                    stats.style.display = 'grid';
                } else {
                    error.textContent = '错误：' + (data.error || '加载失败');
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = '网络错误：' + err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
            }
        }
        
        async function loadHistory() {
            const loading = document.getElementById('historyLoading');
            const error = document.getElementById('historyError');
            const table = document.getElementById('historyTable');
            
            loading.classList.add('show');
            error.classList.remove('show');
            table.innerHTML = '';
            
            try {
                const response = await fetch('/api/historical_data?limit=100');
                const data = await response.json();
                
                if (response.ok) {
                    const totalCount = data.total_count;
                    const displayLimit = 100;
                    const displayData = data.data;
                    
                    const html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>期号</th>
                                    <th>日期</th>
                                    <th>前区</th>
                                    <th>后区</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${displayData.map(row => `
                                    <tr>
                                        <td>${row.period}</td>
                                        <td>${row.date}</td>
                                        <td>${row.front_1} ${row.front_2} ${row.front_3} ${row.front_4} ${row.front_5}</td>
                                        <td>${row.back_1} ${row.back_2}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        <div style="text-align: center; padding: 15px; color: #667eea; font-weight: bold; font-size: 1.1em;">
                            ${totalCount > displayLimit ? `显示最近 ${displayLimit} 条，` : ''}总共 ${totalCount} 条历史数据
                        </div>
                    `;
                    table.innerHTML = html;
                } else {
                    error.textContent = '错误：' + (data.error || '加载失败');
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = '网络错误：' + err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
            }
        }
    </script>
</body>
</html>
