<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大乐透AI预测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }
        
        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }
        
        .button:hover {
            background: #5568d3;
        }
        
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .prediction-result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .numbers {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        
        .number {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
        }
        
        .front-number {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .back-number {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .stat-item h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1em;
        }
        
        .stat-numbers {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .stat-numbers span {
            background: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .success {
            background: #efe;
            color: #060;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }
        
        .success.show {
            display: block;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background: #667eea;
            color: white;
        }
        
        .disclaimer {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎰 大乐透AI预测系统</h1>
            <p>基于机器学习的号码分析与预测</p>
        </div>
        
        <div class="card">
            <h2>数据采集</h2>
            <button class="button" onclick="scrapeData()">采集历史开奖数据</button>
            <div id="scrapeLoading" class="loading">正在采集数据，请稍候...</div>
            <div id="scrapeError" class="error"></div>
            <div id="scrapeSuccess" class="success"></div>
        </div>
        
        <div class="card">
            <h2>AI号码预测</h2>
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; margin-right: 10px;">选择玩法：</label>
                <select id="playTypeSelect" style="padding: 8px; font-size: 14px; border-radius: 5px; border: 1px solid #ddd;">
                    <option value="basic">基础推荐 (5+2)</option>
                    <option value="multiple">多组推荐 (3组)</option>
                    <option value="top_prob">高概率推荐 (Top10+Top5)</option>
                    <option value="dantuo">胆拖推荐 (2胆8拖+1胆4拖)</option>
                </select>
            </div>
            <button class="button" onclick="predictNumbers()">生成预测号码</button>
            <div id="predictLoading" class="loading">AI正在分析中...</div>
            <div id="predictError" class="error"></div>
            <div id="predictionResult" class="prediction-result" style="display: none;">
                <h3 id="resultTitle">预测结果：</h3>
                <div id="resultContent"></div>
            </div>
        </div>
        
        <div class="card">
            <h2>统计分析</h2>
            <button class="button" onclick="loadStatistics()">查看统计数据</button>
            <div id="statsLoading" class="loading">加载中...</div>
            <div id="statsError" class="error"></div>
            <div id="statistics" class="stats-grid" style="display: none;"></div>
        </div>
        
        <div class="card">
            <h2>📊 模型评估</h2>
            <p style="margin-bottom: 15px; color: #666;">评估AI模型的预测准确率和性能指标（需要较长时间运行）</p>
            <button class="button" onclick="runEvaluation()">运行模型评估</button>
            <button class="button" onclick="loadEvaluationReport()" style="margin-left: 10px; background: #28a745;">查看最新报告</button>
            <div id="evalLoading" class="loading">评估运行中，预计需要5-10分钟...</div>
            <div id="evalError" class="error"></div>
            <div id="evalSuccess" class="success"></div>
            <div id="evaluationReport" style="display: none; margin-top: 20px;">
                <h3 style="color: #667eea; margin-bottom: 15px;">评估报告</h3>
                <div id="reportContent"></div>
            </div>
        </div>
        
        <div class="card">
            <h2>历史开奖记录</h2>
            <button class="button" onclick="loadHistory()">加载历史数据</button>
            <div id="historyLoading" class="loading">加载中...</div>
            <div id="historyError" class="error"></div>
            <div id="historyTable" style="overflow-x: auto;"></div>
        </div>
        
        <div class="disclaimer">
            ⚠️ 重要提示：本系统仅用于数据分析和学习研究，预测号码仅供参考。彩票开奖具有随机性，本系统不能保证中奖。请理性购彩，量力而行。
        </div>
    </div>
    
    <script>
        async function scrapeData() {
            const loading = document.getElementById('scrapeLoading');
            const error = document.getElementById('scrapeError');
            const success = document.getElementById('scrapeSuccess');
            
            loading.classList.add('show');
            error.classList.remove('show');
            success.classList.remove('show');
            
            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ limit: 5000 })
                });
                const data = await response.json();
                
                if (response.ok) {
                    let message = data.message;
                    if (data.sources) {
                        message += `\n数据来源：${data.sources.join(', ')}`;
                    }
                    success.textContent = message;
                    success.classList.add('show');
                } else {
                    error.textContent = '错误：' + (data.error || '数据采集失败');
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = '网络错误：' + err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
            }
        }
        
        async function predictNumbers() {
            const loading = document.getElementById('predictLoading');
            const error = document.getElementById('predictError');
            const result = document.getElementById('predictionResult');
            const playType = document.getElementById('playTypeSelect').value;
            
            loading.classList.add('show');
            error.classList.remove('show');
            result.style.display = 'none';
            
            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ play_type: playType })
                });
                const data = await response.json();
                
                if (response.ok) {
                    displayPredictionResult(data.prediction, playType);
                    result.style.display = 'block';
                } else {
                    error.textContent = '错误：' + (data.error || '预测失败');
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = '网络错误：' + err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
            }
        }
        
        function displayPredictionResult(prediction, playType) {
            const resultContent = document.getElementById('resultContent');
            const resultTitle = document.getElementById('resultTitle');
            resultContent.innerHTML = '';
            
            if (playType === 'basic') {
                resultTitle.textContent = '基础推荐 (5+2)：';
                const pred = prediction.predictions[0];
                const betAmount = 2;
                resultContent.innerHTML = `
                    <div style="background: #e3f2fd; padding: 12px; border-radius: 8px; margin-bottom: 15px;">
                        <p style="margin: 0; color: #1565c0; font-weight: bold;">💰 投注金额：${betAmount} 元 (单注)</p>
                    </div>
                    <div>
                        <p><strong>前区号码：</strong></p>
                        <div class="numbers">
                            ${pred.front.map(n => `<div class="number front-number">${String(n).padStart(2, '0')}</div>`).join('')}
                        </div>
                        ${pred.front_probs ? `<p style="margin-top: 10px; font-size: 12px; color: #666;">概率: ${Object.values(pred.front_probs).slice(0, 5).map(p => p.toFixed(3)).join(', ')}</p>` : ''}
                    </div>
                    <div style="margin-top: 15px;">
                        <p><strong>后区号码：</strong></p>
                        <div class="numbers">
                            ${pred.back.map(n => `<div class="number back-number">${String(n).padStart(2, '0')}</div>`).join('')}
                        </div>
                        ${pred.back_probs ? `<p style="margin-top: 10px; font-size: 12px; color: #666;">概率: ${Object.values(pred.back_probs).slice(0, 2).map(p => p.toFixed(3)).join(', ')}</p>` : ''}
                    </div>
                `;
            } else if (playType === 'multiple') {
                resultTitle.textContent = '多组推荐 (3组)：';
                const totalAmount = prediction.predictions.length * 2;
                let html = `
                    <div style="background: #e3f2fd; padding: 12px; border-radius: 8px; margin-bottom: 15px;">
                        <p style="margin: 0; color: #1565c0; font-weight: bold;">💰 总投注金额：${totalAmount} 元 (${prediction.predictions.length} 组 × 2元)</p>
                    </div>
                `;
                prediction.predictions.forEach((pred, idx) => {
                    html += `
                        <div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                            <h4 style="margin: 0 0 10px 0; color: #667eea;">第 ${idx + 1} 组 (2元)</h4>
                            <div>
                                <p><strong>前区：</strong></p>
                                <div class="numbers">
                                    ${pred.front.map(n => `<div class="number front-number">${String(n).padStart(2, '0')}</div>`).join('')}
                                </div>
                            </div>
                            <div style="margin-top: 10px;">
                                <p><strong>后区：</strong></p>
                                <div class="numbers">
                                    ${pred.back.map(n => `<div class="number back-number">${String(n).padStart(2, '0')}</div>`).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                });
                resultContent.innerHTML = html;
            } else if (playType === 'top_prob') {
                resultTitle.textContent = '高概率推荐 (Top候选)：';
                const pred = prediction.predictions[0];
                const frontProbs = pred.front_probs || {};
                const backProbs = pred.back_probs || {};
                resultContent.innerHTML = `
                    <div style="background: #fff3e0; padding: 12px; border-radius: 8px; margin-bottom: 15px;">
                        <p style="margin: 0; color: #e65100; font-size: 14px;">
                            💡 这是候选号码列表，您可从中选择5个前区和2个后区进行投注 (单注2元)
                        </p>
                    </div>
                    <div>
                        <p><strong>前区 Top 10 候选号码：</strong></p>
                        <div class="numbers">
                            ${pred.front.map((n) => `
                                <div class="number front-number" style="position: relative;">
                                    ${String(n).padStart(2, '0')}
                                    <span style="position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #666;">
                                        ${(frontProbs[n] || frontProbs[String(n)] || 0).toFixed(3)}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div style="margin-top: 30px;">
                        <p><strong>后区 Top 5 候选号码：</strong></p>
                        <div class="numbers">
                            ${pred.back.map((n) => `
                                <div class="number back-number" style="position: relative;">
                                    ${String(n).padStart(2, '0')}
                                    <span style="position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #666;">
                                        ${(backProbs[n] || backProbs[String(n)] || 0).toFixed(3)}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (playType === 'dantuo') {
                resultTitle.textContent = '胆拖推荐：';
                const pred = prediction.predictions[0];
                const frontDan = pred.front_dan || [];
                const frontTuo = pred.front_tuo || [];
                const backDan = pred.back_dan || [];
                const backTuo = pred.back_tuo || [];
                const combinations = pred.combination_count || prediction.total_combinations || 0;
                const totalAmount = combinations * 2;
                
                resultContent.innerHTML = `
                    <div style="background: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                        <p style="margin: 0; color: #2e7d32; font-weight: bold;">📊 总投注组合数：${combinations} 注</p>
                        <p style="margin: 5px 0 0 0; font-weight: bold; color: #1565c0;">💰 总投注金额：${totalAmount} 元 (${combinations}注 × 2元)</p>
                        <p style="margin: 5px 0 0 0; font-size: 13px; color: #666;">${pred.description || ''}</p>
                    </div>
                    <div>
                        <p><strong>前区胆码 (必选${frontDan.length}个)：</strong></p>
                        <div class="numbers">
                            ${frontDan.map(n => `<div class="number front-number">${String(n).padStart(2, '0')}</div>`).join('')}
                        </div>
                    </div>
                    <div style="margin-top: 15px;">
                        <p><strong>前区拖码 (从${frontTuo.length}个中选3个)：</strong></p>
                        <div class="numbers">
                            ${frontTuo.map(n => `<div class="number" style="background: linear-gradient(135deg, #a29bfe, #6c5ce7); color: white;">${String(n).padStart(2, '0')}</div>`).join('')}
                        </div>
                    </div>
                    <div style="margin-top: 15px;">
                        <p><strong>后区胆码 (必选${backDan.length}个)：</strong></p>
                        <div class="numbers">
                            ${backDan.map(n => `<div class="number back-number">${String(n).padStart(2, '0')}</div>`).join('')}
                        </div>
                    </div>
                    <div style="margin-top: 15px;">
                        <p><strong>后区拖码 (从${backTuo.length}个中选1个)：</strong></p>
                        <div class="numbers">
                            ${backTuo.map(n => `<div class="number" style="background: linear-gradient(135deg, #fd79a8, #e84393); color: white;">${String(n).padStart(2, '0')}</div>`).join('')}
                        </div>
                    </div>
                    <div style="margin-top: 15px; padding: 10px; background: #fff3cd; border-radius: 5px;">
                        <p style="margin: 0; font-size: 14px; color: #856404;">
                            💡 胆拖说明：胆码必中，拖码任选。前区C(${frontTuo.length},3) × 后区C(${backTuo.length},1) = ${combinations} 种组合
                        </p>
                    </div>
                `;
            }
        }
        
        async function loadStatistics() {
            const loading = document.getElementById('statsLoading');
            const error = document.getElementById('statsError');
            const stats = document.getElementById('statistics');
            
            loading.classList.add('show');
            error.classList.remove('show');
            stats.style.display = 'none';
            
            try {
                const response = await fetch('/api/statistics');
                const data = await response.json();
                
                if (response.ok) {
                    stats.innerHTML = `
                        <div class="stat-item">
                            <h3>热门前区号码</h3>
                            <div class="stat-numbers">
                                ${data.hot_front.map(([num, count]) => 
                                    `<span>${num} (${count}次)</span>`
                                ).join('')}
                            </div>
                        </div>
                        <div class="stat-item">
                            <h3>冷门前区号码</h3>
                            <div class="stat-numbers">
                                ${data.cold_front.map(([num, count]) => 
                                    `<span>${num} (${count}次)</span>`
                                ).join('')}
                            </div>
                        </div>
                        <div class="stat-item">
                            <h3>热门后区号码</h3>
                            <div class="stat-numbers">
                                ${data.hot_back.map(([num, count]) => 
                                    `<span>${num} (${count}次)</span>`
                                ).join('')}
                            </div>
                        </div>
                        <div class="stat-item">
                            <h3>冷门后区号码</h3>
                            <div class="stat-numbers">
                                ${data.cold_back.map(([num, count]) => 
                                    `<span>${num} (${count}次)</span>`
                                ).join('')}
                            </div>
                        </div>
                    `;
                    stats.style.display = 'grid';
                } else {
                    error.textContent = '错误：' + (data.error || '加载失败');
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = '网络错误：' + err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
            }
        }
        
        async function loadHistory() {
            const loading = document.getElementById('historyLoading');
            const error = document.getElementById('historyError');
            const table = document.getElementById('historyTable');
            
            loading.classList.add('show');
            error.classList.remove('show');
            table.innerHTML = '';
            
            try {
                const response = await fetch('/api/historical_data?limit=100');
                const data = await response.json();
                
                if (response.ok) {
                    const totalCount = data.total_count;
                    const displayLimit = 100;
                    const displayData = data.data;
                    
                    const html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>期号</th>
                                    <th>日期</th>
                                    <th>前区</th>
                                    <th>后区</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${displayData.map(row => `
                                    <tr>
                                        <td>${row.period}</td>
                                        <td>${row.date}</td>
                                        <td>${row.front_1} ${row.front_2} ${row.front_3} ${row.front_4} ${row.front_5}</td>
                                        <td>${row.back_1} ${row.back_2}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        <div style="text-align: center; padding: 15px; color: #667eea; font-weight: bold; font-size: 1.1em;">
                            ${totalCount > displayLimit ? `显示最近 ${displayLimit} 条，` : ''}总共 ${totalCount} 条历史数据
                        </div>
                    `;
                    table.innerHTML = html;
                } else {
                    error.textContent = '错误：' + (data.error || '加载失败');
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = '网络错误：' + err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
            }
        }
        
        async function runEvaluation() {
            const loading = document.getElementById('evalLoading');
            const error = document.getElementById('evalError');
            const success = document.getElementById('evalSuccess');
            const report = document.getElementById('evaluationReport');
            
            loading.classList.add('show');
            error.classList.remove('show');
            success.classList.remove('show');
            report.style.display = 'none';
            
            try {
                const response = await fetch('/api/evaluation/run', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        train_size: 100,
                        test_size: 20,
                        step: 20
                    })
                });
                const data = await response.json();
                
                if (response.ok) {
                    success.textContent = '✅ 评估完成！请点击"查看最新报告"查看详细结果。';
                    success.classList.add('show');
                    setTimeout(() => loadEvaluationReport(), 1000);
                } else {
                    error.textContent = '错误：' + (data.error || '评估运行失败');
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = '网络错误：' + err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
            }
        }
        
        async function loadEvaluationReport() {
            const error = document.getElementById('evalError');
            const report = document.getElementById('evaluationReport');
            const content = document.getElementById('reportContent');
            
            error.classList.remove('show');
            
            try {
                const response = await fetch('/api/evaluation/report');
                const data = await response.json();
                
                if (response.ok) {
                    const metrics = data.metrics;
                    const html = `
                        <div style="background: #f8f9fa; padding: 20px; border-radius: 8px;">
                            <h4 style="color: #667eea; margin-bottom: 15px;">📈 性能指标</h4>
                            
                            <div style="margin-bottom: 20px;">
                                <h5 style="margin-bottom: 10px;">前区预测准确率</h5>
                                <div style="background: white; padding: 15px; border-radius: 5px;">
                                    <p><strong>Hit-rate@10:</strong> ${(metrics.front_hit_rate_10 * 100).toFixed(2)}%</p>
                                    <p><strong>Hit-rate@15:</strong> ${(metrics.front_hit_rate_15 * 100).toFixed(2)}%</p>
                                    <p><strong>平均命中数:</strong> ${metrics.front_avg_hits.toFixed(2)} / 5</p>
                                </div>
                            </div>
                            
                            <div style="margin-bottom: 20px;">
                                <h5 style="margin-bottom: 10px;">后区预测准确率</h5>
                                <div style="background: white; padding: 15px; border-radius: 5px;">
                                    <p><strong>Hit-rate@5:</strong> ${(metrics.back_hit_rate_5 * 100).toFixed(2)}%</p>
                                    <p><strong>平均命中数:</strong> ${metrics.back_avg_hits.toFixed(2)} / 2</p>
                                </div>
                            </div>
                            
                            <div style="margin-bottom: 20px;">
                                <h5 style="margin-bottom: 10px;">期望收益</h5>
                                <div style="background: white; padding: 15px; border-radius: 5px;">
                                    <p><strong>期望收益:</strong> ${metrics.expected_value.toFixed(4)}</p>
                                    <p style="color: #666; font-size: 0.9em;">（正值表示理论盈利，负值表示理论亏损）</p>
                                </div>
                            </div>
                            
                            <div>
                                <h5 style="margin-bottom: 10px;">对比随机选号</h5>
                                <div style="background: white; padding: 15px; border-radius: 5px;">
                                    <p><strong>AI vs 随机前区:</strong> ${(metrics.front_hit_rate_10 * 100).toFixed(2)}% vs ${(metrics.random_front_hit_rate * 100).toFixed(2)}%</p>
                                    <p><strong>AI vs 随机后区:</strong> ${(metrics.back_hit_rate_5 * 100).toFixed(2)}% vs ${(metrics.random_back_hit_rate * 100).toFixed(2)}%</p>
                                    <p style="color: ${metrics.front_hit_rate_10 > metrics.random_front_hit_rate ? '#28a745' : '#dc3545'}; font-weight: bold;">
                                        ${metrics.front_hit_rate_10 > metrics.random_front_hit_rate ? '✅ AI模型优于随机选号' : '⚠️ AI模型未超过随机基准'}
                                    </p>
                                </div>
                            </div>
                            
                            <div style="margin-top: 20px; padding: 15px; background: #e7f3ff; border-radius: 5px;">
                                <p style="margin: 0; color: #0066cc;">
                                    <strong>💡 说明：</strong>这些指标基于历史数据的回测验证，使用Walk-forward时间序列验证方法，严格避免数据泄漏。
                                </p>
                            </div>
                        </div>
                    `;
                    content.innerHTML = html;
                    report.style.display = 'block';
                } else {
                    error.textContent = '错误：' + (data.error || '暂无评估报告，请先运行评估');
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = '网络错误：' + err.message;
                error.classList.add('show');
            }
        }
    </script>
</body>
</html>
